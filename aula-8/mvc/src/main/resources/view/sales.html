<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Vendas</title>
</head>
<body>

    <header>
        <h1>Gerenciamento de Vendas</h1>
        <nav>
            <a th:href="@{/}">Voltar para Início</a> |
            <a th:href="@{/products}">Produtos</a> |
            <a th:href="@{/stock}">Estoque</a>
        </nav>
    </header>

    <main>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <section>
            <h2>Novo Pedido</h2>
            <form th:action="@{/sales}" method="post">
                <div>
                    <label for="customerName">Cliente:</label>
                    <input type="text" id="customerName" name="customerName" required>
                </div>
                <div>
                    <label for="productId">Produto:</label>
                    <select id="productId" name="productId" required>
                        <option value="" disabled selected>Selecione um produto</option>
                        <option th:each="prod : ${products}"
                                th:value="${prod.id}"
                                th:text="${prod.name + ' (R$ ' + prod.price + ' - ' + prod.status + ' - Qtd: ' + prod.stockQuantity + ')'}">
                        </option>
                    </select>
                </div>
                <div>
                    <label for="quantity">Quantidade:</label>
                    <input type="number" id="quantity" name="quantity" min="1" required>
                </div>
                <button type="submit">Criar Pedido</button>
            </form>
        </section>

        <section>
            <h2>Pedidos</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Produto</th>
                        <th>Qtd</th>
                        <th>Total (R$)</th>
                        <th>Status</th>
                        <th>ID da Fatura</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sale : ${sales}">
                        <td th:text="${sale.id}"></td>
                        <td th:text="${sale.customerName}"></td>
                        <td th:text="${sale.product.name}"></td>
                        <td th:text="${sale.quantity}"></td>
                        <td th:text="${sale.totalAmount}"></td>
                        <td th:text="${sale.status}"></td>
                        <td th:text="${sale.invoiceId != null ? sale.invoiceId : '-'}"></td>
                        <td>
                            <form th:if="${sale.status.name() == 'ABERTO'}"
                                  th:action="@{/sales/{id}/close(id=${sale.id})}"
                                  method="post"
                                  class="inline-form">
                                <button type="submit">Fechar Pedido</button>
                            </form>
                            <span th:if="${sale.status.name() == 'FECHADO'}">Faturado</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        Projeto de compreensão do MVC
    </footer>

</body>
</html>
